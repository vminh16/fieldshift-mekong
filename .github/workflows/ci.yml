name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend
        run: python -m pip install -e './apps/api[dev]'
      - name: Unit and transport tests
        run: make test
      - name: Validate configs
        run: make config-check
      - name: Ruff
        run: python -m ruff check apps/api scripts && python -m ruff format --check apps/api scripts
      - name: Check generated OpenAPI contract
        run: PYTHONPATH=apps/api/src python scripts/generate_openapi.py --check
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm install --no-audit --no-fund
        working-directory: apps/web
      - name: Typecheck and build
        run: npm run typecheck && npm run build
        working-directory: apps/web

# Production stack on the Oracle VM. Host Caddy fronts fieldshift.loanhviet.dev:
#   /v1/* -> 127.0.0.1:18100 (api), everything else -> 127.0.0.1:18101 (web).
# Deploy: docker compose -f infra/compose.oracle.yaml -p fieldshift up -d --build
services:
  api:
    build: ../apps/api
    restart: unless-stopped
    ports: ["127.0.0.1:18100:8000"]
    environment:
      APP_ENV: production
      CORS_ORIGINS: https://fieldshift.loanhviet.dev
      FIELDSHIFT_DATA_DIR: /data
    volumes: [api-data:/data]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/v1/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
  web:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports: ["127.0.0.1:18101:80"]
volumes:
  api-data:
